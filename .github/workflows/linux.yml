name: Linux

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'doc/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # Check https://github.com/actions/checkout/releases for newer major versions.
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup ccache
      id: ccache
      uses: ./.github/actions/setup-ccache
    - name: Install build tools, build, run ctest, write man page, install (make.sh all)
      run: ./make.sh all -y
    - name: Smoke (side by side) - popup hierarchy, command keys, warm host protocol, warm handoff, word navigation, session check, composer rows, cursor click
      # Eight scripts side by side. word_navigation_smoke used to run session check, composer rows and cursor
      # click one after another inside itself (about 85 s on Linux, 113 s on macOS); they now run alongside it.
      timeout-minutes: 5
      env:
        HARBOR_EXECUTABLE: ${{ github.workspace }}/build/bin/harbor
      run: |
        python3 -m venv "$RUNNER_TEMP/harbor-smoke-venv"
        py="$RUNNER_TEMP/harbor-smoke-venv/bin/python"
        "$py" -m pip install -r tests/harbor/requirements.txt
        scripts="reply_display_smoke reply_spacing_smoke appearance_smoke wheel_burst_smoke popup_hierarchy_smoke command_keys_smoke warm_host_protocol warm_handoff_smoke word_navigation_smoke session_check_smoke composer_rows_smoke cursor_click_smoke restart_all_smoke"
        scripts="$scripts typing_smoke message_click_smoke picture_open_smoke preview_guard_smoke input_latency_smoke ui_identity_smoke"
        scripts="$scripts shell_copy_smoke restart_generation_smoke command_menu_smoke"
        scripts="$scripts reply_click_smoke"
        # A cancelled or timed-out step still shows what each script printed.
        trap 'for s in $scripts; do echo "::group::$s (unfinished)"; cat "$RUNNER_TEMP/$s.log" 2>/dev/null || true; echo "::endgroup::"; done' INT TERM
        for s in $scripts; do
          # The step's shell runs with -e, so the exit code is caught with || rather than read from $?.
          ( start=$SECONDS; rc=0; "$py" "tests/harbor/$s.py" > "$RUNNER_TEMP/$s.log" 2>&1 || rc=$?
            echo "$rc $((SECONDS - start))" > "$RUNNER_TEMP/$s.rc" ) &
        done
        wait
        failed=0
        for s in $scripts; do
          rc=missing; secs=unknown
          [ -r "$RUNNER_TEMP/$s.rc" ] && { read -r rc secs < "$RUNNER_TEMP/$s.rc" || rc=empty; }
          echo "::group::$s exit=$rc ${secs}s"; cat "$RUNNER_TEMP/$s.log" || true; echo "::endgroup::"
          [ "$rc" = 0 ] || { echo "::error::$s failed (exit $rc)"; failed=1; }
        done
        exit $failed
    - name: Save build cache (main only)
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.ccache.outputs.path }}
        key: ${{ steps.ccache.outputs.key }}
