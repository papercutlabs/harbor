name: Harbor macOS bundle

on:
  pull_request:
    paths:
      - '.github/workflows/harbor-release.yml'
      - 'utils/dist/*harbor*'
      - 'tests/harbor/package_test.py'
  workflow_dispatch:
  push:
    tags:
      - 'harbor-*'

permissions:
  contents: read

concurrency:
  group: harbor-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-latest
    env:
      JOBS: 2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install hosted build prerequisites
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake pkg-config gperf autoconf automake libtool ccache meson ninja
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nchat-dist
          key: harbor-dist-macos-arm64-${{ github.run_id }}
          restore-keys: |
            harbor-dist-macos-arm64-
      - name: Test package contract
        run: python3 -m unittest discover -s tests/harbor -p package_test.py
      - name: Build, package and smoke actual Harbor
        run: |
          export CCACHE_DIR="${HOME}/.cache/nchat-dist/harbor-ccache"
          ./utils/dist/build-harbor-macos.sh
      - name: Require tag to name the packaged source and version
        if: startsWith(github.ref, 'refs/tags/harbor-')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          pin = json.load(open('dist/harbor-release.json'))
          assert pin['artifacts']['macos-arm64']['tag'] == os.environ['RELEASE_TAG'], 'tag does not match actual Harbor source/version'
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: harbor-macos-arm64
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/harbor-*-macos-arm64.tar.gz
            dist/harbor-*-macos-arm64.tar.gz.sha256
            dist/harbor-release.json
  publish:
    if: startsWith(github.ref, 'refs/tags/harbor-')
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: harbor-macos-arm64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/harbor-*-macos-arm64.tar.gz
            dist/harbor-*-macos-arm64.tar.gz.sha256
            dist/harbor-release.json
